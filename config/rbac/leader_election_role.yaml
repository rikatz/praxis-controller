apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: praxis-controller-leader-election
  namespace: praxis-system
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, create, update]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: praxis-controller-leader-election
  namespace: praxis-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: praxis-controller-leader-election
subjects:
  - kind: ServiceAccount
    name: praxis-controller
    namespace: praxis-system
