apiVersion: v1
kind: Namespace
metadata:
  name: praxis-system
---
apiVersion: v1
kind: Service
metadata:
  name: praxis-controller-metrics
  namespace: praxis-system
spec:
  selector:
    app.kubernetes.io/name: praxis-controller
  ports:
    - name: https-metrics
      port: 8443
      targetPort: https-metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: praxis-controller
  namespace: praxis-system
  labels:
    app.kubernetes.io/name: praxis-controller
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: praxis-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: praxis-controller
    spec:
      serviceAccountName: praxis-controller
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: controller:dev
          imagePullPolicy: IfNotPresent
          args:
            - --leader-elect=true
          ports:
            - name: https-metrics
              containerPort: 8443
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: metrics-serving-cert
              mountPath: /var/run/praxis/metrics/tls
              readOnly: true
      volumes:
        - name: metrics-serving-cert
          secret:
            secretName: praxis-controller-metrics-serving-cert
